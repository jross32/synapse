name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: Node — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  python:
    timeout-minutes: 15
    name: Python — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install daemon (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Fast contract check for the remote AI control plane. Keep this ahead of
      # the full suite so MCP discovery/dispatch regressions surface quickly.
      - name: MCP connector smoke
        run: pytest -q daemon/tests/test_mcp_chatgpt_compat.py daemon/tests/test_mcp_connector.py

      # Tests must run even when release metadata is stale. A docs-sync failure
      # should still fail the job, but it must not hide code regressions by
      # skipping pytest entirely.
      - name: Run pytest
        run: pytest -q

      - name: Docs-sync gate (versions agree + CHANGELOG + README current)
        run: python scripts/docs_sync_check.py
