name: Smart Review remediation v2

on:
  push:
    branches:
      - feature/token-aware-review-engine
    paths:
      - .github/workflows/smart-review-remediation-v2.yml
      - scripts/smart_review_remediation_v2.py

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/token-aware-review-engine
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Smart Review remediation
        run: python scripts/smart_review_remediation_v2.py

      - name: Install daemon
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Verify focused Smart Review gates
        run: |
          python scripts/docs_sync_check.py
          python -m compileall -q daemon/synapse_daemon daemon/tests
          pytest -q daemon/tests/test_review_engine.py daemon/tests/test_smart_review_routes.py

      - name: Commit remediation
        run: |
          git config user.name "synapse-review-remediation[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md docs/security.md daemon/synapse_daemon/review_engine.py daemon/synapse_daemon/routes_review.py daemon/tests/test_review_engine.py daemon/tests/test_smart_review_routes.py
          if git diff --cached --quiet; then
            echo "No remediation changes required."
            exit 0
          fi
          git commit -m "Address Smart Review budget, capacity, and safety findings"
          git push origin HEAD:feature/token-aware-review-engine
