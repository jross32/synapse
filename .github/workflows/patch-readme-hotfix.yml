name: One-time README version sync

on:
  push:
    branches:
      - fix/chatgpt-mcp-resource-compat-20260905

permissions:
  contents: write

jobs:
  patch-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chatgpt-mcp-resource-compat-20260905

      - name: Sync README version exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = "**Status:** early development (`v0.1.205`)."
          new = "**Status:** early development (`v0.1.209`)."
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one README status marker; found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit exact README sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: sync README status to 0.1.209"
          git push origin HEAD:fix/chatgpt-mcp-resource-compat-20260905
