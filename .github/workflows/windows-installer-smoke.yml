name: Windows Installer Isolated Install Smoke

on:
  workflow_run:
    workflows:
      - Windows Installer Candidate (verification only)
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Windows candidate workflow run ID
        required: true
        type: string
      source_commit:
        description: Exact 40-character candidate source commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  install-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - name: Download candidate from specific Actions run
        uses: actions/download-artifact@v4
        with:
          name: synapse-unsigned-windows-test-candidate
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: test-installer

      - name: Check source identity, integrity, and preview-only metadata
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.source_commit }}
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'CI runner required' }
          $receipt = Get-Content test-installer/verification.json -Raw | ConvertFrom-Json
          if (-not $env:EXPECTED_SHA) {
            # Auto-triggered after a successful build: use its receipt's pinned
            # checkout SHA, not github.event.workflow_run.head_sha (main branch).
            $env:EXPECTED_SHA = [string]$receipt.source_commit
          }
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Full SHA required' }
          "EXPECTED_SHA=$env:EXPECTED_SHA" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($receipt.status -ne 'UNSIGNED_TEST_CANDIDATE_ONLY') { throw 'Not an unsigned test candidate' }
          if ($receipt.source_commit -ne $env:EXPECTED_SHA) { throw 'Unexpected source commit' }
          if ($receipt.install_e2e_verified -ne $false -or $receipt.windows_authenticode_signed -ne $false) { throw 'Misleading release claims' }
          $installer = Get-ChildItem test-installer -File -Filter '*.exe' | Select-Object -First 1
          if (-not $installer -or $installer.Name -ne $receipt.filename) { throw 'Installer artifact missing' }
          if ($installer.Length -ne $receipt.size_bytes) { throw 'Installer size mismatch' }
          $sha = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $receipt.sha256) { throw 'Installer checksum mismatch' }
          Write-Output ('verified unsigned installer bytes='+$installer.Length)

      - name: Silent clean-install file smoke on disposable Windows runner
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or -not $env:RUNNER_TEMP) { throw 'Disposable CI runner required' }
          $installer = Get-ChildItem test-installer -File -Filter '*.exe' | Select-Object -First 1
          # Install into a disposable runner with a synthetic pre-existing
          # Synapse preference file. Only file persistence is asserted; this
          # is NOT an actual account/device/MCP credential migration test.
          $existingData = Join-Path $env:APPDATA 'Synapse'
          New-Item -ItemType Directory -Force -Path $existingData | Out-Null
          $sentinel = Join-Path $existingData 'ci-preservation-sentinel.txt'
          $sentinelBytes = [Text.Encoding]::UTF8.GetBytes('preserve-existing-data-' + $env:EXPECTED_SHA)
          [IO.File]::WriteAllBytes($sentinel, $sentinelBytes)
          $originalHash = (Get-FileHash $sentinel -Algorithm SHA256).Hash
          # Real NSIS bootstrap filenames were previously overwritten during
          # upgrades. Seed distinct owner-selected choices and verify both.
          $preferences = @{
            'bootstrap-ai-bundles.json' = '{"bundle_ids":["owner-existing-bundle"]}'
            'bootstrap-optional-tools.json' = '{"install_tool_ids":[],"uninstall_tool_ids":["owner-existing-tool"]}'
          }
          $preferenceHashes = @{}
          foreach ($name in $preferences.Keys) {
            $prefPath = Join-Path $existingData $name
            [IO.File]::WriteAllText($prefPath, $preferences[$name])
            $preferenceHashes[$name] = (Get-FileHash $prefPath -Algorithm SHA256).Hash
          }
          $installRoot = Join-Path $env:RUNNER_TEMP 'SynapseCleanInstallSmoke'
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S',('/D='+$installRoot)) -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw ('Silent NSIS installation exited '+$process.ExitCode) }
          $paths = @($installRoot, (Join-Path $env:LOCALAPPDATA 'Programs/Synapse'))
          $installed = $null
          foreach ($root in $paths) {
            if (Test-Path (Join-Path $root 'Synapse.exe')) { $installed = $root; break }
          }
          if (-not $installed) { throw 'Synapse.exe not found after silent installation' }
          if (!(Test-Path $sentinel)) { throw 'Existing Synapse user data was removed by installer' }
          foreach ($name in $preferences.Keys) {
            $prefPath = Join-Path $existingData $name
            if (!(Test-Path $prefPath) -or (Get-FileHash $prefPath -Algorithm SHA256).Hash -ne $preferenceHashes[$name]) {
              throw "Installer overwrote existing Synapse bootstrap preference: $name"
            }
          }
          if ((Get-FileHash $sentinel -Algorithm SHA256).Hash -ne $originalHash) {
            throw 'Existing Synapse user data changed during installer'
          }
          $daemon = Join-Path $installed 'resources/daemon/synapse-daemon.exe'
          if (!(Test-Path $daemon) -or (Get-Item $daemon).Length -lt 1000000) { throw 'Bundled daemon absent from installed files' }
          # Reinstall the SAME preview build as a limited idempotence check.
          # Do not confuse this with a tested cross-version upgrade/rollback.
          $reinstall = Start-Process -FilePath $installer.FullName -ArgumentList @('/S',('/D='+$installRoot)) -PassThru -Wait
          if ($reinstall.ExitCode -ne 0) { throw ('Same-build reinstall exited '+$reinstall.ExitCode) }
          if (!(Test-Path $sentinel) -or (Get-FileHash $sentinel -Algorithm SHA256).Hash -ne $originalHash) {
            throw 'Same-build reinstall changed existing Synapse user data'
          }
          foreach ($name in $preferences.Keys) {
            $prefPath = Join-Path $existingData $name
            if (!(Test-Path $prefPath) -or (Get-FileHash $prefPath -Algorithm SHA256).Hash -ne $preferenceHashes[$name]) {
              throw "Same-build reinstall overwrote Synapse bootstrap preference: $name"
            }
          }
          if (!(Test-Path (Join-Path $installed 'Synapse.exe')) -or !(Test-Path $daemon)) {
            throw 'Same-build reinstall removed Synapse executable or daemon'
          }
          @{
            status = 'CI_SILENT_FILE_INSTALL_VERIFIED_ONLY'
            source_commit = $env:EXPECTED_SHA
            installed_electron = $true
            installed_daemon = $true
            synthetic_userdata_sentinel_preserved = $true
            same_build_reinstall_sentinel_preserved = $true
            existing_bootstrap_preferences_preserved = $true
            interactive_ui_verified = $false
            account_preserved_verified = $false
            device_identity_preserved_verified = $false
            mcp_url_preserved_verified = $false
            upgrade_rollback_verified = $false
            stable_release_approved = $false
          } | ConvertTo-Json | Set-Content test-installer/install-smoke.json -Encoding utf8

      - name: Publish only isolated smoke evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synapse-windows-clean-install-smoke-evidence
          path: test-installer/install-smoke.json
          if-no-files-found: ignore
          retention-days: 7
