          if ($receipt.status -ne 'UNSIGNED_TEST_CANDIDATE_ONLY') { throw 'Not an unsigned test candidate' }
          if ($receipt.source_commit -ne $env:EXPECTED_SHA) { throw 'Unexpected source commit' }
          if ($receipt.install_e2e_verified -ne $false -or $receipt.windows_authenticode_signed -ne $false) { throw 'Misleading release claims' }
