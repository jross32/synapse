name: macOS Engineering Preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'electron/**'
      - 'daemon/**'
      - 'installer/build-daemon-macos.sh'
      - '.github/workflows/macos-engineering-preview.yml'
permissions:
  contents: read
jobs:
  mac-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -e '.[dev]' pyinstaller
      - name: Compile frontend
        run: npm run build
      - name: Build native daemon
        run: bash installer/build-daemon-macos.sh
      - name: Build unsigned Mac engineering preview
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Check artifact contents
        run: |
          test -x installer/daemon-dist/synapse-daemon
          installer/daemon-dist/synapse-daemon --help >/dev/null
          APP=$(find release -maxdepth 2 -name Synapse.app -type d | head -n 1)
          test -n "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          test -x "$APP/Contents/Resources/daemon/synapse-daemon"
          file "$APP/Contents/Resources/daemon/synapse-daemon"
          find release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -print
          test "$(find release -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" -ge 1
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-macos-${{ matrix.arch }}-unsigned
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
