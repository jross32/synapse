name: Windows preview installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Preview version (e.g. 0.2.221)"
        required: true
        type: string
      publish:
        description: "Publish GitHub prerelease after successful build"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-preview-release
  cancel-in-progress: false

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and source
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw 'Expected semantic version X.Y.Z' }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.version -ne $env:RELEASE_VERSION) { throw "package.json version $($package.version) does not match requested $env:RELEASE_VERSION" }
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python daemon and bundler
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Typecheck and build
        run: npm run typecheck
      - name: Run renderer and Electron build
        run: npm run build
      - name: Run first-launch unit tests
        run: node --test tests/first-launch-install.test.cjs
      - name: Bundle daemon
        shell: pwsh
        run: |
          $env:SYNAPSE_BUILD_PYTHON = (python -c "import sys; print(sys.executable)")
          npm run build:daemon
      - name: Build unsigned preview installer
        shell: pwsh
        run: |
          npx electron-builder --win nsis --config.win.signAndEditExecutable=false
      - name: Verify installer and record checksum
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' -File | Where-Object { $_.Name -match 'Setup' } | Select-Object -First 1
          if (-not $installer -or $installer.Length -lt 50000000) { throw 'Expected installer artifact missing or undersized' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$($installer.Name) SHA256 $hash" | Set-Content release/SHA256SUMS.txt
          Write-Host "Preview artifact: $($installer.Name) SHA256 $hash"
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-windows-preview-${{ inputs.version }}
          path: |
            release/*Setup*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish opt-in unsigned prerelease
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $tag = "preview-v$env:RELEASE_VERSION-$($env:GITHUB_SHA.Substring(0,8))"
          $files = @(Get-ChildItem release -Filter '*Setup*.exe' -File | ForEach-Object { $_.FullName })
          $files += (Resolve-Path release/SHA256SUMS.txt).Path
          gh release create $tag @files --target $env:GITHUB_SHA --prerelease --title "Synapse v$env:RELEASE_VERSION (unsigned Windows preview)" --notes "Unsigned testing build. Not a stable release. Windows SmartScreen may warn. Preserve stable installers and settings. SHA256SUMS.txt is attached."
