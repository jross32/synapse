          python -m pip install -e '.[dev]'
          pytest -q daemon/tests/test_review_engine.py daemon/tests/test_smart_review_routes.py

      - name: Commit branch fixes
        run: |
          git config user.name "synapse-review-bootstrap[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/api-finds.md docs/api-changes.md daemon/synapse_daemon/routes_ai.py daemon/synapse_daemon/routes_review.py daemon/synapse_daemon/review_engine.py daemon/tests/test_review_engine.py daemon/tests/test_smart_review_routes.py
          if git diff --cached --quiet; then
            echo "No bootstrap changes required."
            exit 0
          fi
          git commit -m "Complete Smart Review AI contract and safety gates"
          git push origin HEAD:feature/token-aware-review-engine
