name: Smart Review branch bootstrap

on:
  push:
    branches:
      - feature/token-aware-review-engine
    paths:
      - .github/workflows/smart-review-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/token-aware-review-engine
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Smart Review branch fixes
        run: python scripts/smart_review_branch_bootstrap.py

      - name: Install daemon
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Verify docs and focused review tests
        run: |
          python scripts/docs_sync_check.py
          python -m compileall -q daemon/synapse_daemon daemon/tests
          pytest -q daemon/tests/test_review_engine.py daemon/tests/test_smart_review_routes.py

      - name: Commit branch fixes
        run: |
          git config user.name "synapse-review-bootstrap[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/api-finds.md docs/api-changes.md daemon/synapse_daemon/routes_ai.py daemon/synapse_daemon/routes_review.py daemon/synapse_daemon/review_engine.py daemon/tests/test_review_engine.py daemon/tests/test_smart_review_routes.py
          if git diff --cached --quiet; then
            echo "No bootstrap changes required."
            exit 0
          fi
          git commit -m "Complete Smart Review AI contract and safety gates"
          git push origin HEAD:feature/token-aware-review-engine
